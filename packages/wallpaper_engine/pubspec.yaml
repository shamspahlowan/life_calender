name: wallpaper_engine
description: "Native live-wallpaper engine for Resonance: renders the wallpaper on Android and exposes a type-safe Pigeon API to Flutter."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^27.3.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.shozen.wallpaper_engine
        pluginClass: WallpaperEnginePlugin
